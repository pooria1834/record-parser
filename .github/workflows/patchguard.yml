# COPY to .github/workflows/patchguard.yml in the C/C++ TARGET repository.
# Replace OWNER/REPO@PINNED_COMMIT with the published, immutable PatchGuard SHA.
# Adjust .patchguard/config.yaml to your target's paths, corpus, build and oracle.
name: PatchGuard PR gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  patchguard-security:
    name: patchguard-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export trusted base source tree
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p .patchguard/base
          git archive "$BASE_SHA" | tar -x -C .patchguard/base
      - name: Validate candidate against base
        uses: pooria1834/PatchGuard@90a78cd82d98a7c238ea393de2da6a4d5c74982f
        env:
          PATCHGUARD_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        with:
          config: .patchguard/config.yaml
          report-dir: artifacts/patchguard
      - name: Upload concise report and one archive (even if blocked)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-pr-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/patchguard/summary.md
            artifacts/patchguard/verdict.json
            artifacts/patchguard/evidence-index.md
            artifacts/patchguard/regression-candidates.md
            artifacts/patchguard/technical-evidence.zip
