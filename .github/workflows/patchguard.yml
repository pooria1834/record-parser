name: PatchGuard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patchguard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run PatchGuard
        id: patchguard
        uses: pooria1834/PatchGuard@1d493e1e2d7e641aa1f3709aec8c2aaaa625c39e
        with:
          config: .patchguard/config.yaml
          report-dir: artifacts/patchguard
          auto-regression-pr: 'true'
          github-token: ${{ github.token }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-evidence
          if-no-files-found: warn
          path: |
            artifacts/patchguard/summary.md
            artifacts/patchguard/verdict.json
            artifacts/patchguard/report.json
            artifacts/patchguard/regression-pr-preparation.json
            artifacts/patchguard/regression-pr.json
            artifacts/patchguard/technical-evidence.zip
