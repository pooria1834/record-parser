name: PatchGuard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  patchguard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare source versions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .patchguard/base/src
          mkdir -p .patchguard/patched/src

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          echo "Base commit: $BASE_SHA"
          echo "Patched commit: $(git rev-parse HEAD)"

          git archive "$BASE_SHA" | tar -x -C .patchguard/base/src
          git archive HEAD | tar -x -C .patchguard/patched/src

          echo "Source versions prepared successfully."

      - name: Run PatchGuard
        id: patchguard
        uses: pooria1834/PatchGuard@NEW_COMMIT_SHA
        with:
          config: .patchguard/config.yaml
          report-dir: artifacts/patchguard
          auto-regression-pr: 'true'
          github-token: ${{ github.token }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-pr-evidence
          if-no-files-found: warn
          path: |
            artifacts/patchguard/summary.md
            artifacts/patchguard/verdict.json
            artifacts/patchguard/report.json
            artifacts/patchguard/evidence-index.md
            artifacts/patchguard/evidence-index.json
            artifacts/patchguard/regression-candidates.md
            artifacts/patchguard/regression-pr-preparation.json
            artifacts/patchguard/regression-pr.json
            artifacts/patchguard/technical-evidence.zip
