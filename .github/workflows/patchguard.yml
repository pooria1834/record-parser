name: PatchGuard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patchguard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]' || !startsWith(github.head_ref, 'patchguard/regressions-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout untrusted source (without credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact baseline source tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .patchguard/base
          mkdir -p .patchguard/base

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          # The trusted config expects .patchguard/base/src/record_parser.c.
          git archive "$BASE_SHA" src | tar -x -C .patchguard/base

          printf 'PATCHGUARD_BASE_REVISION=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"

          test -f .patchguard/base/src/record_parser.c
          test -f src/record_parser.c

      - name: Run PatchGuard (no write token)
        id: patchguard
        uses: pooria1834/PatchGuard@c28873ab7d3e319262791e913fd27ce156d3f4a7
        with:
          config: .patchguard/config.yaml
          report-dir: artifacts/patchguard
          auto-regression-pr: 'false'

      - name: Upload evidence even when PatchGuard finds a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchguard-pr-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/patchguard/summary.md
            artifacts/patchguard/verdict.json
            artifacts/patchguard/report.json
            artifacts/patchguard/evidence-index.md
            artifacts/patchguard/evidence-index.json
            artifacts/patchguard/regression-candidates.md
            artifacts/patchguard/technical-evidence.zip
